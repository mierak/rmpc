name: Release rmpc

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      release:
        description: "Create a draft release, otherwise only upload the build to this run"
        type: boolean
        default: false

jobs:
  build-linux:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - os: ubuntu-latest
            target: arm-unknown-linux-gnueabihf
    steps:
      - name: Install prerequisites
        run: |
          cargo install cross --git https://github.com/cross-rs/cross

      - name: Read release tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              echo "RELEASE_TAG=${GITHUB_REF#refs/tags/}"  >> "$GITHUB_ENV"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
              echo "This workflow only handles v*.*.* tags, got $GITHUB_REF"
              exit 1
          elif [ "${{ inputs.release }}" == 'true' ]; then
              echo "Releasing requires running this workflow from a v*.*.* tag, got $GITHUB_REF"
              exit 1
          else
              echo "RELEASE_TAG=master" >> "$GITHUB_ENV"
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch tags
        run: |
          git fetch --tags -f

      - name: Build release
        run: |
          cross build --release --target ${{ matrix.target }}

      - name: Copy artifacts
        working-directory: ./target
        run: |
          mkdir -p "/tmp/artifacts"
          tar cvzf "/tmp/artifacts/rmpc-$RELEASE_TAG-${{ matrix.target }}.tar.gz" "man" "completions" -C "./${{ matrix.target }}/release" "rmpc"

      - name: Upload build artifacts (manual run)
        if: github.event_name == 'workflow_dispatch' && !inputs.release
        uses: actions/upload-artifact@v7
        with:
          path: /tmp/artifacts/rmpc-${{ env.RELEASE_TAG }}-${{ matrix.target }}.tar.gz
          archive: false

      - name: Release
        if: github.event_name == 'push' || inputs.release
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          draft: true
          artifacts: /tmp/artifacts/*

  build-macos:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - name: Install prerequisites
        run: |
          cargo install cross --git https://github.com/cross-rs/cross

      - name: Read release tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              echo "RELEASE_TAG=${GITHUB_REF#refs/tags/}"  >> "$GITHUB_ENV"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
              echo "This workflow only handles v*.*.* tags, got $GITHUB_REF"
              exit 1
          elif [ "${{ inputs.release }}" == 'true' ]; then
              echo "Releasing requires running this workflow from a v*.*.* tag, got $GITHUB_REF"
              exit 1
          else
              echo "RELEASE_TAG=master" >> "$GITHUB_ENV"
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch tags
        run: |
          git fetch --tags -f

      - name: Build release
        run: |
          rustup target add ${{ matrix.target }}
          cargo build --release --target ${{ matrix.target }}

      - name: Copy artifacts
        working-directory: ./target
        run: |
          mkdir -p "/tmp/artifacts"
          tar cvzf "/tmp/artifacts/rmpc-$RELEASE_TAG-${{ matrix.target }}.tar.gz" "man" "completions" -C "./${{ matrix.target }}/release" "rmpc"

      - name: Upload build artifacts (manual run)
        if: github.event_name == 'workflow_dispatch' && !inputs.release
        uses: actions/upload-artifact@v7
        with:
          path: /tmp/artifacts/rmpc-${{ env.RELEASE_TAG }}-${{ matrix.target }}.tar.gz
          archive: false

      - name: Release
        if: github.event_name == 'push' || inputs.release
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          draft: true
          artifacts: /tmp/artifacts/*
